name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        run: npm install -g pnpm@11.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Build web edition
        run: |
          pnpm --filter "@codex-avatar-studio/studio^..." build
          if [ -z "${VITE_TLDRAW_LICENSE_KEY:-}" ]; then
            echo "W0.3: tldraw license is not configured. Using the explicit local-development opt-out so the bundle check can run."
            KURVA_ALLOW_MISSING_TLDRAW_LICENSE=1 pnpm --filter @codex-avatar-studio/studio build:web
          else
            pnpm --filter @codex-avatar-studio/studio build:web
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Validate third-party notices
        run: pnpm validate:notices

      - name: Package VSIX
        run: pnpm package:vsix

      - name: Validate VSIX contents
        run: pnpm validate:vsix

      - name: Run packaged smoke
        run: pnpm smoke:vsix

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        run: npm install -g pnpm@11.7.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Production dependency audit
        run: pnpm audit --prod
      - name: Build web edition
        run: |
          pnpm --filter "@codex-avatar-studio/studio^..." build
          # web-avatar-package imports AvatarPackageRegistry from the extension dist.
          pnpm --filter codex-avatar-studio-extension build
          # The canvas smokes below need a licensed canvas. Without a key the app shows the license
          # notice instead of tldraw. The evaluation trial key ships in the browser bundle via
          # apps/studio/.env.web-site (owner-accepted for non-production); Actions secrets override.
          export VITE_TLDRAW_LICENSE_KEY="${VITE_TLDRAW_LICENSE_KEY:-$(sed -n 's/^VITE_TLDRAW_LICENSE_KEY=//p' apps/studio/.env.web-site)}"
          pnpm --filter @codex-avatar-studio/studio build:web
      - name: Web unit tests
        run: pnpm exec vitest run apps/studio/test/webOpenRouter.test.ts apps/studio/test/webShell.test.ts apps/studio/test/browserLibrary.test.ts apps/studio/test/browserAvatarPackage.test.ts apps/studio/test/webCspGates.test.ts packages/studio-host-core/test/openRouterPkce.test.ts
      - name: Web header file
        run: node scripts/check-web-headers.mjs
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Web accessibility, offline, and header smoke
        env:
          KURVA_BROWSER: chromium
        run: |
          node scripts/web-a11y.mjs
          node scripts/web-offline.mjs
          node scripts/web-project-lock.mjs
          node scripts/web-backup-clear.mjs
          node scripts/web-canvas-persist.mjs
          node scripts/web-export.mjs
          node scripts/web-avatar-package.mjs
          node scripts/web-design-frame.mjs
          node scripts/smoke-web-staging.mjs
      - name: Design frames render in Firefox and WebKit
        run: |
          pnpm exec playwright install --with-deps firefox webkit
          KURVA_BROWSER=firefox node scripts/web-design-frame.mjs
          KURVA_BROWSER=webkit node scripts/web-design-frame.mjs
