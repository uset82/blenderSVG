<!doctype html>

<x-dc>
<helmet>

<style>

<div style="width: 1440px; height: 900px; display: flex; background: #F3EEE3; color: #1B1A17; font-family: 'Hanken Grotesk', sans-serif; font-size: 14px">

<a href="#home" style="text-decoration: none; padding: 9px 10px; border-radius: 6px; background: #1B1A17; color: #FBF8F1">Home</a>
<a href="#recents" style="text-decoration: none; padding: 9px 10px; border-radius: 6px">Recents</a>
<a href="#projects" style="text-decoration: none; padding: 9px 10px; border-radius: 6px">Projects</a>
<a href="#assets" style="text-decoration: none; padding: 9px 10px; border-radius: 6px">Assets</a>

<div style="display: flex; justify-content: space-between"><span style="color: #5A554B">Blender</span><span>detected</span></div>
<div style="display: flex; justify-content: space-between"><span style="color: #5A554B">Remote AI</span><span>off</span></div>
</div>

</div>

<span style="font-size: 17px; color: #5A554B">Describe a character, or drop a picture here…</span>
<span style="display: flex; align-items: center; gap: 10px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 5px 10px; border: 1px solid rgba(27,26,23,0.18); border-radius: 999px">local only</span>
<span style="flex-grow: 1"></span>
<span style="width: 36px; height: 36px; border-radius: 999px; background: #B53A17; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FBF8F1" stroke-width="2" stroke-linecap="round"><path d="M12 19V5M5 12l7-7 7 7"></path></svg></span>
</span>
</label>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
<button type="button" style="font: inherit; text-align: left; padding: 18px; background: #FBF8F1; border: 1px solid rgba(27,26,23,0.14); border-radius: 14px; display: flex; flex-direction: column; gap: 6px; color: #1B1A17"><span style="font-weight: 600; font-size: 15px">Picture → SVG</span><span style="color: #5A554B">Trace a PNG or JPG into layered vectors.</span></button>
<button type="button" style="font: inherit; text-align: left; padding: 18px; background: #FBF8F1; border: 1px solid rgba(27,26,23,0.14); border-radius: 14px; display: flex; flex-direction: column; gap: 6px; color: #1B1A17"><span style="font-weight: 600; font-size: 15px">Open an SVG</span><span style="color: #5A554B">Sanitized on import, editable on the canvas.</span></button>
<button type="button" style="font: inherit; text-align: left; padding: 18px; background: #FBF8F1; border: 1px solid rgba(27,26,23,0.14); border-radius: 14px; display: flex; flex-direction: column; gap: 6px; color: #1B1A17"><span style="font-weight: 600; font-size: 15px">Blender scene (copy)</span><span style="color: #5A554B">Your original .blend is never changed.</span></button>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="font-weight: 600; font-size: 16px">Recents</span><span style="display: flex; gap: 12px; align-items: center"><span style="color: #5A554B">Grid · List</span><button type="button" style="font: inherit; padding: 8px 14px; border-radius: 999px; border: 0; background: #1B1A17; color: #FBF8F1">New file</button></span></div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">

<div style="display: flex; flex-direction: column; gap: 8px"><div style="height: 150px; border-radius: 12px; border: 1px solid rgba(27,26,23,0.14); background: #FBF8F1; display: flex; align-items: center; justify-content: center"><svg width="70" height="70" viewBox="0 0 64 64" aria-hidden="true"><line x1="18" y1="10" x2="18" y2="54" stroke="#1B1A17" stroke-width="8" stroke-linecap="round"></line><path d="M48 10 C16 28 16 36 48 54" fill="none" stroke="#D2461E" stroke-width="8" stroke-linecap="round"></path></svg></div><span style="font-weight: 500">kurva-mark</span><span style="color: #5A554B; font-size: 13px">Edited [TIME]</span></div>
<div style="display: flex; flex-direction: column; gap: 8px"><div style="height: 150px; border-radius: 12px; border: 1px dashed rgba(27,26,23,0.3); background: transparent; display: flex; align-items: center; justify-content: center; color: #5A554B">[PROJECT THUMBNAIL]</div><span style="font-weight: 500">[PROJECT NAME]</span><span style="color: #5A554B; font-size: 13px">Edited [TIME]</span></div>
<div style="display: flex; flex-direction: column; gap: 8px"><div style="height: 150px; border-radius: 12px; border: 1px dashed rgba(27,26,23,0.3); background: transparent; display: flex; align-items: center; justify-content: center; color: #5A554B">[PROJECT THUMBNAIL]</div><span style="font-weight: 500">[PROJECT NAME]</span><span style="color: #5A554B; font-size: 13px">Edited [TIME]</span></div>
</div>
</div>
