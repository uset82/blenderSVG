<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Editor on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#151516;font-family:'Geist',system-ui,sans-serif;color:#ededef}
a{color:#ededef}a:hover{color:#ffffff}
button,input,textarea,select{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background-color: #151516; background-image: radial-gradient(circle, #2a2a2d 1px, transparent 1.3px); background-size: 16px 16px; color: #ededef; font-family: 'Geist', system-ui, sans-serif; font-size: 13px; overflow: hidden;">

<header style="height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 8px; background: #1b1b1d; border-bottom: 1px solid #2e2e32;">
<a href="Main.dc.html" aria-label="Home" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px;">
<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="1" width="22" height="22" rx="7" fill="#ededef"></rect><path d="M6.5 16.5c3.5 0 3.5-9 7-9 2 0 2.6 2 3.5 3" fill="none" stroke="#151516" stroke-width="2" stroke-linecap="round"></path><circle cx="6.5" cy="16.5" r="1.8" fill="#151516"></circle><circle cx="17" cy="10.5" r="1.8" fill="#151516"></circle></svg>
</a>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0;"><span style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Untitled</span><span style="font-size: 11px; color: #8b8b93;">Auto-saved</span></span>
<button type="button" aria-label="Export" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; border-radius: 8px; color: #a3a3aa;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" x2="12" y1="15" y2="3"></line></svg>
</button>
<button type="button" aria-label="More" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; border-radius: 8px; color: #a3a3aa;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>
</button>
</header>

<div style="height: 268px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;">
<div style="display: flex; flex-direction: column; gap: 6px;">
<span style="font-size: 11px; color: #8b8b93;">Mobile · 390 × 844</span>
<div aria-label="Empty mobile frame" style="width: 104px; height: 224px; background: #ffffff; border-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.25);"></div>
</div>
</div>

<div style="height: 60px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;">
<div role="toolbar" aria-label="Tools" style="display: flex; align-items: center; gap: 2px; padding: 4px; background: #1b1b1d; border: 1px solid #2e2e32; border-radius: 12px;">
<button type="button" aria-label="Select" aria-pressed="true" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: {{accent}}; border: 0; border-radius: 8px; color: #0d1526;">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4.7a.5.5 0 0 1 .7-.7l16 6.5a.5.5 0 0 1-.1.9l-6.1 1.6a2 2 0 0 0-1.4 1.4l-1.6 6.1a.5.5 0 0 1-.9.1z"></path></svg>
</button>
<button type="button" aria-label="Frame" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; border-radius: 8px; color: #a3a3aa;">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" x2="2" y1="6" y2="6"></line><line x1="22" x2="2" y1="18" y2="18"></line><line x1="6" x2="6" y1="2" y2="22"></line><line x1="18" x2="18" y1="2" y2="22"></line></svg>
</button>
<button type="button" aria-label="Rectangle" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; border-radius: 8px; color: #a3a3aa;">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"></rect></svg>
</button>
<button type="button" aria-label="Pen" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; border-radius: 8px; color: #a3a3aa;">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.7 21.3a1 1 0 0 1-1.4 0l-1.6-1.6a1 1 0 0 1 0-1.4l5.6-5.6a1 1 0 0 1 1.4 0l1.6 1.6a1 1 0 0 1 0 1.4z"></path><path d="m18 13-1.4-6.9a1 1 0 0 0-.7-.8L3.2 2a1 1 0 0 0-1.2 1.2l3.3 12.7a1 1 0 0 0 .8.7L13 18"></path><path d="m2.3 2.3 7.3 7.3"></path><circle cx="11" cy="11" r="2"></circle></svg>
</button>
<button type="button" aria-label="Text" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; border-radius: 8px; color: #a3a3aa;">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" x2="15" y1="20" y2="20"></line><line x1="12" x2="12" y1="4" y2="20"></line></svg>
</button>
<button type="button" aria-label="Image or SVG" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; border-radius: 8px; color: #a3a3aa;">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"></path></svg>
</button>
</div>
</div>

<section aria-label="Agent sheet" style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; background: #1b1b1d; border-top: 1px solid #36363b; border-radius: 16px 16px 0 0; box-shadow: 0 -8px 24px rgba(0,0,0,0.35);">
<button type="button" aria-label="Resize sheet" style="height: 20px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0;"><span style="width: 36px; height: 4px; border-radius: 999px; background: #4a4a50;"></span></button>
<div role="tablist" aria-label="Panels" style="display: flex; align-items: center; gap: 2px; padding: 0 8px 6px;">
<button type="button" role="tab" aria-selected="true" style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; background: #2b2b2f; border: 0; border-radius: 8px; color: #ededef; font-size: 13px; font-weight: 500;">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z"></path></svg>
Agent</button>
<button type="button" role="tab" aria-selected="false" aria-label="Layers" style="width: 44px; height: 36px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; border-radius: 8px; color: #a3a3aa;">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.8 2.2a2 2 0 0 0-1.7 0L2.6 6.1a1 1 0 0 0 0 1.8l8.6 3.9a2 2 0 0 0 1.7 0l8.6-3.9a1 1 0 0 0 0-1.8Z"></path><path d="m22 17.6-9.2 4.2a2 2 0 0 1-1.7 0L2 17.6"></path><path d="m22 12.6-9.2 4.2a2 2 0 0 1-1.7 0L2 12.6"></path></svg>
</button>
<button type="button" role="tab" aria-selected="false" aria-label="Properties" style="width: 44px; height: 36px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; border-radius: 8px; color: #a3a3aa;">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="21" x2="14" y1="4" y2="4"></line><line x1="10" x2="3" y1="4" y2="4"></line><line x1="21" x2="12" y1="12" y2="12"></line><line x1="8" x2="3" y1="12" y2="12"></line><line x1="21" x2="16" y1="20" y2="20"></line><line x1="12" x2="3" y1="20" y2="20"></line><line x1="14" x2="14" y1="2" y2="6"></line><line x1="8" x2="8" y1="10" y2="14"></line><line x1="16" x2="16" y1="18" y2="22"></line></svg>
</button>
<div style="flex-grow: 1;"></div>
<button type="button" style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; background: transparent; border: 1px solid #2e2e32; border-radius: 8px; color: #ededef; font-size: 13px;">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
New</button>
</div>

<div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; padding: 8px 12px;">
<h2 style="margin: 0 0 2px; font-size: 13px; font-weight: 600;">Ask me to design anything</h2>
<button type="button" style="min-height: 44px; padding: 0 12px; background: transparent; border: 1px solid #2e2e32; border-radius: 8px; color: #a3a3aa; font-size: 13px; text-align: left;">Onboarding screens for a plant-care app</button>
<button type="button" style="min-height: 44px; padding: 0 12px; background: transparent; border: 1px solid #2e2e32; border-radius: 8px; color: #a3a3aa; font-size: 13px; text-align: left;">Friendly mascot with idle and thinking states</button>
<button type="button" style="min-height: 44px; padding: 0 12px; background: transparent; border: 1px solid #2e2e32; border-radius: 8px; color: #a3a3aa; font-size: 13px; text-align: left;">Turn my sketch into a clean vector logo</button>
</div>

<form style="margin: 8px 8px 12px; display: flex; flex-direction: column; background: #232326; border: 1px solid #36363b; border-radius: 12px;">
<label for="m-prompt" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Message the agent</label>
<textarea id="m-prompt" rows="1" placeholder="Design anything…" style="min-height: 44px; padding: 12px 12px 4px; background: transparent; border: 0; outline: none; resize: none; color: #ededef; font-size: 15px; line-height: 1.4;"></textarea>
<div style="display: flex; align-items: center; gap: 4px; padding: 4px 6px 6px;">
<button type="button" aria-label="Add context" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; border-radius: 8px; color: #a3a3aa;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
</button>
<button type="button" style="height: 36px; padding: 0 8px; background: transparent; border: 0; border-radius: 8px; color: #a3a3aa; font-size: 12px;">Build</button>
<div style="flex-grow: 1;"></div>
<button type="button" style="height: 36px; padding: 0 8px; background: transparent; border: 0; border-radius: 8px; color: #a3a3aa; font-size: 12px;">Claude Sonnet 5</button>
<button type="submit" aria-label="Send" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: {{accent}}; border: 0; border-radius: 999px; color: #0d1526;">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7"></path><path d="M12 19V5"></path></svg>
</button>
</div>
</form>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#7aa7ff","options":["#7aa7ff","#8fd694","#f0a35e","#c7a6ff"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#7aa7ff' };
  }
}
</script>
</body>
</html>
